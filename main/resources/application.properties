# ===================================================================
# SeatPlan - Exam Hall Seating Arrangement Generator
# Application Configuration
# ===================================================================

spring.application.name=seatplan
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Connection Settings
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/seat_plan?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Amirtham@11
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false

# -------------------------------------------------------------------
# Web & Static Resources
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
